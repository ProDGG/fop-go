<html><head><style>@page{size:A4 landscape;margin:1cm}
body{font-family:Arial;font-size:9pt}
p{margin:5px 0}
.box{border:1px solid #888;padding:4px}
</style></head><body>
<div style="width:100%;min-height:100px;position:relative;border:1px solid red">
  <div style="width:100%;margin-bottom:10px">
    <div style="position:absolute;top:20px;left:0;"><p>Left abs text one</p><p>second line</p></div>
    <div style="position:absolute;top:10px;right:0;text-align:right;"><p>Right abs text</p></div>
  </div>
</div>
<p>After block paragraph that follows the relative container.</p>
<div class="box" style="position:relative;left:30px;top:10px;background:#eef">Relative offset box</div>
<div class="box">Normal box <span style="position:relative;top:-4px;color:blue">relative span</span> tail text</div>
<div style="position:relative;height:80px;border:1px solid green;margin-top:20px">
  <div style="position:absolute;left:10px;right:10px;top:5px;bottom:5px;background:#fee;z-index:5">pinned</div>
  <div style="position:absolute;right:0;bottom:0;width:100px;background:#efe;z-index:1">bottom-right</div>
  <div style="position:absolute;left:50px;top:30px;width:120px;background:#ffd;z-index:9">above</div>
</div>
<div style="position:absolute;top:300px;left:400px;width:150px;background:#ddd">page-level abs</div>
<p>Final paragraph.</p>
</body></html>
