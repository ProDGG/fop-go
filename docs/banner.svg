      <text x="48" y="108" font-size="26" fill="#5dc9e2" text-anchor="middle">XML</text>
      <rect x="0" y="176" width="96" height="60" rx="8" fill="#1f2f58" stroke="#8fb4ff" stroke-width="2"/>
      <text x="48" y="214" font-size="22" fill="#8fb4ff" text-anchor="middle">XSLT</text>
    </g>
    <path d="M98 100H130Q150 100 150 120V180Q150 206 130 206H98M150 150H168" fill="none" stroke="#5dc9e2" stroke-width="3" stroke-linecap="round"/>
