<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">fop-go</title>
  <desc id="d">XML and XSLT or HTML go in, a PDF comes out. Pure Go, no Java.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#16264a"/>
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00add8"/>
      <stop offset="1" stop-color="#5dc9e2"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <g opacity=".08" stroke="#5dc9e2">
    <path d="M0 80H1280M0 160H1280M0 240H1280M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
  </g>

  <text x="64" y="140" font-family="Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#fff" letter-spacing="-2">fop<tspan fill="url(#go)">-go</tspan></text>
  <text x="68" y="190" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#c9d6f2">XML + XSLT  →  PDF. Pure Go. No Java.</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8fb4ff">
    <text x="68" y="238">Apache FOP pipeline · Flying Saucer / iText compatible HTML reports</text>
    <text x="68" y="268">XSLT 1.0 · XPath 1.0 · XSL-FO · CSS 2.1 · zero dependencies</text>
  </g>

  <!-- pipeline illustration -->
  <g transform="translate(790 52)" font-family="Helvetica, Arial, sans-serif" font-weight="700">
    <g filter="url(#sh)">
